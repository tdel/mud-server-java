spring:
  application:
    name: mud-server-java
  datasource:
    url: jdbc:sqlite:./mud-server.db
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys = ON"
  jooq:
    sql-dialect: SQLITE
  flyway:
    locations: classpath:db/migration
    # SQLite refuse de changer PRAGMA foreign_keys à l'intérieur d'une transaction ;
    # V8__add_character_world_instance.sql mélange donc des statements transactionnels
    # et non-transactionnels dans le même fichier, ce que Flyway rejette par défaut
    # (mixed=false).
    mixed: true

app:
  tcpjson:
    enabled: true
    port: 4002

logging:
  level:
    root: INFO
  pattern:
    # %mdc affiche automatiquement connectionId/account/character quand connus
    # (posés par TcpJsonSessionHandler/AuthWorld), vide sinon.
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} %mdc - %msg%n%wEx"
  file:
    name: logs/mud-server.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  structured:
    format:
      # JSON sur disque (support natif Spring Boot, MDC inclus automatiquement),
      # console volontairement laissée en texte lisible pour le dev local.
      file: logstash

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        # Auto-enabled by Spring Boot when it detects it's running in a
        # container, which drags root /actuator/health status into the
        # readiness probe. Readiness never flips to ACCEPTING_TRAFFIC here:
        # TcpJsonServer.start() runs as the ApplicationReadyEvent listener and
        # blocks the main thread for the process lifetime (its designed job),
        # so the framework's own readiness-event step right after that never
        # runs. Not a Kubernetes deployment, so disable probes rather than
        # work around a signal we don't use.
        enabled: false
